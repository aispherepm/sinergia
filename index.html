<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap Operação Integrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B14; --surface:#0D1320; --card:#111827; --border:#1E293B; --border2:#334155;
  --text:#F1F5F9; --text2:#94A3B8; --muted:#64748B;
  --red:#CC092F; --red2:#E6395A; --blue:#5B8CFF; --deep:#41719C;
  --green:#34C15C; --teal:#2DD4BF; --violet:#A78BFA; --amber:#FFC000;
  --font:'Inter','Avenir Next','Avenir','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ============ APP SHELL ============ */
.app{min-height:100vh;background:var(--bg);position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(7,11,20,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.topbar .brand{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .brand img{height:28px}
.topbar .brand b{font-size:15px;font-weight:600;white-space:nowrap}
.topbar .brand span{font-size:12px;color:var(--text2);white-space:nowrap}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;margin-left:12px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:#1E293B;color:var(--text)}
.spacer{flex:1}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border2);background:var(--surface);padding:8px 13px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#475569;background:#131c2e}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#b0082a}
.btn.ghost{background:none;border-color:transparent;color:var(--text2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:15px;height:15px}
select.res{background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:8px 10px;font-size:13px}

.view{display:none}
.view.on{display:block}

/* editor layout */
.editor{display:grid;grid-template-columns:minmax(420px,560px) 1fr;gap:24px;padding:24px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:14px;font-weight:600}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{width:24px;height:24px;border-radius:7px;background:#1E293B;color:var(--text2);font-size:12px;display:grid;place-items:center;flex:none}
.sec>summary .hint{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.sec>summary .chev{width:16px;height:16px;color:var(--muted);transition:.2s}
.sec[open]>summary .chev{transform:rotate(180deg)}
.sec .body{padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:grid;gap:10px}
.c2{grid-template-columns:1fr 1fr}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
.inp{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
.stage-edit{border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.015)}
.stage-edit .top{display:flex;gap:8px;align-items:center}
.stage-edit .top .idx{font-size:12px;color:var(--muted);width:22px}
.pct-wrap{display:flex;align-items:center;gap:10px}
.pct-wrap input[type=range]{flex:1;accent-color:var(--blue)}
.pct-wrap .inp{width:72px;text-align:right}
.g3{display:grid;grid-template-columns:1.3fr .7fr 1fr;gap:8px}
.list-row{display:flex;gap:8px;align-items:center}
.list-row .inp{flex:1}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.x:hover{background:#1E293B;color:var(--red2)}
.x svg{width:14px;height:14px}
.calc{display:flex;gap:10px}
.calc .box{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;position:relative}
.calc .box input{position:absolute;opacity:0}
.calc .box.on{border-color:var(--blue);background:rgba(91,140,255,.07)}
.calc .box b{display:block;font-size:22px;font-weight:600}
.calc .box span{font-size:12px;color:var(--text2)}
.warn{font-size:12px;color:var(--amber);background:rgba(255,192,0,.08);border:1px solid rgba(255,192,0,.25);border-radius:8px;padding:8px 10px}
.okmsg{font-size:12px;color:var(--green)}
.hist-row{display:grid;grid-template-columns:1fr 90px 28px;gap:8px;align-items:center}
.group-edit{border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px}
.q-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 28px;gap:8px;align-items:center}
.m-row{display:grid;grid-template-columns:1fr 140px 28px;gap:8px;align-items:center}

.preview-col{position:sticky;top:78px}
.preview-col .lbl{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#000}
.frame .scaler{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.full{padding:24px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E293B;border:1px solid var(--border2);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:9999;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:9990;display:none;place-items:center;font-size:14px;color:var(--text2)}
.overlay.on{display:grid}
#exportHost{position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:9980}

@media (max-width:1100px){
  .editor{grid-template-columns:1fr}
  .preview-col{position:static;order:-1}
  .topbar{flex-wrap:wrap}
  .topbar .brand span{display:none}
}
@media (max-width:560px){
  .editor,.full{padding:16px}
  .c2,.g3{grid-template-columns:1fr}
  .q-row{grid-template-columns:1fr 1fr;}
  .tabs{margin-left:0}
}

/* ============ BOARD (1920 x 1080) ============ */
.board{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--font);color:#fff;background:#070B14}
.board .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.board .shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,9,20,.90) 0%,rgba(6,9,20,.78) 45%,rgba(8,10,28,.58) 100%)}
.board .glow{position:absolute;right:-240px;top:-300px;width:900px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(204,9,47,.22),rgba(204,9,47,0))}
.board .glow2{position:absolute;left:-200px;bottom:-360px;width:900px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(91,140,255,.14),rgba(91,140,255,0))}
.board .inner{position:absolute;inset:0;padding:38px 56px 26px;display:flex;flex-direction:column;gap:16px}
.glass{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.b-head{display:flex;align-items:center;gap:26px;height:78px;margin-bottom:6px}
.b-head .logo{height:66px;width:auto}
.b-head .vr{width:1px;height:62px;background:rgba(255,255,255,.18)}
.b-head .eyebrow{font-size:13px;letter-spacing:4px;font-weight:600;color:#FF5A77;text-transform:uppercase}
.b-head h1{font-size:40px;font-weight:600;letter-spacing:-.5px;line-height:1.1;margin:4px 0 3px}
.b-head .sub{font-size:15px;color:rgba(255,255,255,.62);font-weight:300}
.b-head .ref{margin-left:auto;display:flex;align-items:center;gap:16px;padding:14px 22px}
.b-head .ref .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center}
.b-head .ref .ic svg{width:22px;height:22px;stroke:#fff}
.b-head .ref small{display:block;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.55);text-transform:uppercase}
.b-head .ref b{display:block;font-size:26px;font-weight:600;letter-spacing:-.3px;margin-top:2px}

.stages{display:grid;gap:14px;height:262px}
.stage{position:relative;padding:20px 20px 16px;display:flex;flex-direction:column;overflow:hidden}
.stage .accent{position:absolute;left:0;top:0;right:0;height:3px}
.stage .st-top{display:flex;align-items:center;justify-content:space-between}
.stage .st-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.stage .st-ic svg{width:22px;height:22px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage .num{font-size:13px;color:rgba(255,255,255,.4);font-weight:500;letter-spacing:1px}
.stage .name{font-size:14px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;margin-top:16px;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .pct{font-size:52px;font-weight:600;letter-spacing:-2px;line-height:1;margin-top:10px}
.stage .pct small{font-size:24px;font-weight:400;letter-spacing:0;color:rgba(255,255,255,.55);margin-left:2px}
.stage .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.6px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-top:6px}
.stage .lab b{color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:6px}
.stage .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:5px 10px;border-radius:20px;white-space:nowrap;border:1px solid}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.stage .peso{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;text-align:right;line-height:1.3}
.stage .peso b{display:block;color:rgba(255,255,255,.85);font-size:15px;font-weight:600}

.row2{display:grid;grid-template-columns:470px 1fr;gap:14px;height:214px}
.overall{display:flex;align-items:center;gap:26px;padding:22px 28px}
.ring{position:relative;width:162px;height:162px;flex:none}
.ring svg{width:162px;height:162px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:42px;font-weight:600;letter-spacing:-1.5px;line-height:1}
.ring .c span{font-size:10px;letter-spacing:1.6px;color:rgba(255,255,255,.5);margin-top:6px}
.overall h3,.panel h3{font-size:12px;letter-spacing:2.4px;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.62)}
.overall .big{font-size:15px;color:rgba(255,255,255,.7);margin-top:10px;line-height:1.5;font-weight:300}
.overall .big b{color:#fff;font-weight:600}
.delta{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;padding:6px 11px;border-radius:20px;background:rgba(52,193,92,.12);color:#6EE08F;border:1px solid rgba(52,193,92,.3)}
.evo{padding:20px 28px 16px;position:relative}
.evo .chart{position:absolute;left:28px;right:28px;top:48px;bottom:14px}
.evo .chart svg{position:absolute;inset:0;width:100%;height:100%}
.pt-lab{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.pt-lab.v{font-size:17px;font-weight:600}
.pt-lab.d{font-size:12px;color:rgba(255,255,255,.5)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #0B1224}
.evo .legend{position:absolute;right:28px;top:20px;font-size:12px;color:rgba(255,255,255,.5);display:flex;gap:18px}
.evo .legend span{display:inline-flex;align-items:center;gap:7px}
.evo .legend i{width:16px;height:2px;display:inline-block}

.alert{height:78px;display:flex;align-items:center;gap:28px;padding:0 28px;border-radius:18px;border:1px solid}
.alert .ai{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.alert .ai svg{width:22px;height:22px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alert .t{font-size:13px;letter-spacing:2px;font-weight:600;text-transform:uppercase;white-space:nowrap}
.alert .msg{font-size:15px;color:rgba(255,255,255,.8);line-height:1.45;flex:1;padding-left:28px;border-left:1px solid rgba(255,255,255,.12)}
.alert .msg b{color:#fff;font-weight:600}
.alert .kv{display:flex;flex-direction:column;padding-left:26px;border-left:1px solid rgba(255,255,255,.12);white-space:nowrap}
.alert .kv small{font-size:10px;letter-spacing:1.8px;color:rgba(255,255,255,.5);text-transform:uppercase}
.alert .kv b{font-size:17px;font-weight:600;margin-top:3px}

.row4{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:14px;flex:1;min-height:0}
.panel{padding:20px 26px;overflow:hidden;display:flex;flex-direction:column}
.panel h3{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel h3 svg{width:16px;height:16px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mlist{display:flex;flex-direction:column;gap:11px}
.mlist li{list-style:none;display:flex;gap:11px;font-size:14px;line-height:1.4;color:rgba(255,255,255,.88)}
.mlist li svg{width:17px;height:17px;flex:none;margin-top:1px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mlist li i.bul{width:6px;height:6px;border-radius:50%;background:#34C15C;flex:none;margin-top:8px}
.mlist li b{font-weight:600;color:#fff}
.mlist li em{font-style:normal;font-size:11px;color:#FFD34D;margin-left:6px;white-space:nowrap}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px}
.grp b{display:block;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#8FB0FF;font-weight:600;margin-bottom:6px}
.grp li{list-style:none;font-size:13px;line-height:1.35;color:rgba(255,255,255,.82);padding-left:13px;position:relative;margin-bottom:4px}
.grp li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:rgba(143,176,255,.7)}
.qtable{width:100%;border-collapse:collapse}
.qtable th{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:500;text-align:left;padding:0 0 8px}
.qtable td{font-size:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.9);vertical-align:middle}
.qtable td.p{color:rgba(255,255,255,.65);white-space:nowrap;padding:11px 12px}
.qtable th:last-child,.qtable td:last-child{text-align:right}

.b-foot{display:flex;align-items:center;gap:18px;height:26px;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.4px}
.b-foot .who{margin-left:auto;letter-spacing:1.6px;text-transform:uppercase}
.b-foot img{height:22px;opacity:.9}
.b-foot .sep{width:1px;height:16px;background:rgba(255,255,255,.18)}
</style>
</head>

/* Ajusta arquivos salvos na versão anterior */
function normalize(o){
  o.titulos=Object.assign({},TITULOS_PADRAO,o.titulos||{});
  o.prazo=Object.assign({},PRAZO_PADRAO,o.prazo||{});
  (o.etapas||[]).forEach(e=>{e.status=STATUS_ANTIGO[e.status]||(STATUS[e.status]?e.status:'Não iniciado')});
  (o.quadro||[]).forEach(q=>{q.status=STATUS_ANTIGO[q.status]||(STATUS[q.status]?q.status:'Não iniciado')});
  o.melhorias=(o.melhorias||[]).map(m=>{
    if(typeof m==='string') return {texto:m};
    let tx=m.texto||'';
    if(m.status&&m.status!=='Concluída'&&tx&&!/homologa/i.test(tx)) tx+=' ('+(STATUS_ANTIGO[m.status]||m.status).toLowerCase()+(/BPO/.test(m.status)?' com a BPO':'')+')';
    return {texto:tx};
  });
  return o;
}

/* ---------- Utilidades ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function fmtShort(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return `${d}/${m}`}
function clamp(v){v=Number(v);return isNaN(v)?0:Math.max(0,Math.min(100,Math.round(v)))}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function load(){try{const s=localStorage.getItem(STORE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(D));document.getElementById('savedAt').textContent='Salvo neste navegador às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
function icon(k,color){return `<svg viewBox="0 0 24 24" style="stroke:${color}">${ICONS[k]||ICONS.entrega}</svg>`}
function stColor(s){return (STATUS[s]||{c:'#94A3B8'}).c}
function hexA(hex,a){const h=hex.replace('#','');const n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function chip(s){const c=stColor(s);return `<span class="chip" style="color:${c};background:${hexA(c,.10)};border-color:${hexA(c,.35)}"><i style="background:${c}"></i>${esc(s)}</span>`}

function calc(){
  const e=D.etapas; if(!e.length) return {simples:0,ponderado:0,somaPeso:0};
  const simples=e.reduce((a,x)=>a+clamp(x.pct),0)/e.length;
  const somaPeso=e.reduce((a,x)=>a+(Number(x.peso)||0),0);
  const ponderado=somaPeso?e.reduce((a,x)=>a+clamp(x.pct)*(Number(x.peso)||0),0)/somaPeso:0;
  return {simples:Math.round(simples),ponderado:Math.round(ponderado),somaPeso};
}
function geral(){const c=calc();return D.criterio==='ponderado'?c.ponderado:c.simples}
function serie(){
  const pts=(D.historico||[]).filter(h=>h.data&&h.data<D.dataRef).sort((a,b)=>a.data<b.data?-1:1).map(h=>({data:h.data,pct:clamp(h.pct)}));
  pts.push({data:D.dataRef,pct:geral(),atual:true});
  return pts.slice(-7);
}

/* ---------- Painel ---------- */
function boardHTML(){
  const n=D.etapas.length, g=geral(), c=calc();
  const stages=D.etapas.map((e,i)=>{
    const col=stColor(e.status), p=clamp(e.pct);
    return `<div class="stage glass">
      <div class="accent" style="background:${col}"></div>
      <div class="st-top"><div class="st-ic">${icon(e.icone,col)}</div><div class="num">${String(i+1).padStart(2,'0')}</div></div>
      <div class="name" title="${esc(e.nome)}">${esc(e.nome)}</div>
      <div class="pct">${p}<small>%</small></div>
      <div class="lab"><span>Realizado</span><span>Peso <b>${Number(e.peso)||0}%</b></span></div>
      <div class="bar"><i style="width:${p}%;background:${col}"></i></div>
      <div class="foot">${chip(e.status)}</div>
    </div>`}).join('');

  // anel
  const R=70, C=2*Math.PI*R, off=C*(1-g/100);
  const ring=`<div class="ring"><svg viewBox="0 0 162 162">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#FF4D6D"/></linearGradient></defs>
      <circle cx="81" cy="81" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
      <circle cx="81" cy="81" r="${R}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
    </svg><div class="c"><b>${g}%</b><span>DO ROADMAP</span></div></div>`;
  const s=serie(); const prev=s.length>1?s[s.length-2]:null;
  const delta=prev?g-prev.pct:null;
  const crit=D.criterio==='ponderado'?`Média ponderada pelo peso de cada etapa`:`Média simples das ${n} etapas`;
  const overall=`<div class="overall glass">${ring}<div>
      <h3>${esc(D.titulos.progresso)}</h3>
      <div class="big"><b>${g}%</b> do roadmap realizado<br>${crit}</div>
      ${delta!==null?`<div class="delta">${delta>=0?'▲ +':'▼ '}${delta} p.p. desde ${fmtShort(prev.data)}</div>`:''}
    </div></div>`;

  // evolução
  const W=1268, H=152; // área útil aproximada
  const pts=[...s,{data:null,pct:100,meta:true}];
  const padX=40, top=34, bottom=36, h=H-top-bottom;
  const X=i=>padX+(W-2*padX)*(pts.length===1?0.5:i/(pts.length-1));
  const lo=Math.max(0,Math.floor((Math.min(...pts.map(p=>p.pct))-15)/10)*10);
  const Y=v=>top+h*(1-(v-lo)/(100-lo));
  const real=pts.filter(p=>!p.meta);
  const line=real.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.pct).toFixed(1)}`).join(' ');
  const area=`${line} L${X(real.length-1).toFixed(1)},${Y(lo)} L${X(0).toFixed(1)},${Y(lo)} Z`;
  const li=real.length-1;
  let labels='';
  pts.forEach((p,i)=>{
    const x=X(i), y=Y(p.pct);
    const col=p.meta?'rgba(255,255,255,.55)':(p.atual?'#34C15C':'#8FB0FF');
    labels+=`<div class="pt-lab v" style="left:${x}px;top:${y-34}px;color:${p.atual?'#6EE08F':p.meta?'rgba(255,255,255,.75)':'#fff'}">${p.pct}%</div>`;
    labels+=`<div class="pt-lab d" style="left:${x}px;top:${H-18}px">${p.meta?'Meta':fmt(p.data)}</div>`;
    labels+=`<div class="dot" style="left:${x}px;top:${y}px;background:${col};${p.meta?'border-color:rgba(255,255,255,.35);background:transparent;':''}${p.atual?'box-shadow:0 0 0 6px rgba(52,193,92,.18)':''}"></div>`;
  });
  const evo=`<div class="evo glass"><h3 style="font-size:12px;letter-spacing:2.4px;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.62)">${esc(D.titulos.evolucao)}</h3>
    <div class="legend"><span><i style="background:#5B8CFF"></i>Realizado</span><span><i style="background:rgba(255,255,255,.45)"></i>Até a meta</span></div>
    <div class="chart" style="width:${W}px;height:${H}px">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8CFF" stop-opacity=".32"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient></defs>
        <line x1="${padX}" x2="${W-padX}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="rgba(255,255,255,.12)"/>
        <line x1="${padX}" x2="${W-padX}" y1="${Y(100)}" y2="${Y(100)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 5"/>
        <path d="${area}" fill="url(#ag)"/>
        <path d="${line}" fill="none" stroke="#5B8CFF" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M${X(li)},${Y(real[li].pct)} L${X(pts.length-1)},${Y(100)}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-dasharray="6 6"/>
      </svg>${labels}
    </div></div>`;

  // alerta de prazo
  let alert='';
  const P=D.prazo||{};
  if(P.mostrar&&(P.previsao||P.mensagem||P.titulo)){
    const et=D.etapas.find(e=>e.nome===P.marco)||D.etapas[0]||{nome:'',pct:0,status:''};
    const temData=!!P.previsao;
    const dias=temData?daysBetween(P.previsao,D.dataRef):0;
    const concl=clamp(et.pct)>=100;
    const late=temData&&dias>0&&!concl;
    const CORES={vermelho:'#FF4D6D',verde:'#34C15C',azul:'#5B8CFF',amarelo:'#FFC000'};
    const col=P.cor&&CORES[P.cor]?CORES[P.cor]:(late?'#FF4D6D':(temData?'#34C15C':'#5B8CFF'));
    const warnIc='<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>';
    const okIc='<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>';
    const infoIc='<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>';
    const ic=col==='#FF4D6D'||col==='#FFC000'?warnIc:(col==='#34C15C'?okIc:infoIc);
    const tituloAuto=late?'Atenção: atraso no roadmap':(concl?'Marco concluído':(temData?'Dentro do prazo':'Atenção'));
    const titulo=P.titulo?esc(P.titulo):tituloAuto;
    const nd=Math.abs(dias), sd=`${nd} dia${nd===1?'':'s'}`;
    let msg;
    if(P.mensagem){
      msg=rich(P.mensagem).replace(/\{dias\}/g,`<b style="color:${col}">${sd}</b>`).replace(/\{marco\}/g,`<b>${esc(et.nome)}</b>`).replace(/\{previsao\}/g,`<b>${fmt(P.previsao)}</b>`).replace(/\n/g,'<br>');
    } else if(!temData){ msg='';
    } else {
      msg=late
      ?`A previsão de entrega até <b>${esc(et.nome)}</b> era <b>${fmt(P.previsao)}</b>. Estamos com atraso de <b style="color:#FF7A92">${sd}</b> em relação ao cronograma previsto.`
      :(concl?`A entrega até <b>${esc(et.nome)}</b> foi concluída. Previsão original: <b>${fmt(P.previsao)}</b>.`
             :`A previsão de entrega até <b>${esc(et.nome)}</b> é <b>${fmt(P.previsao)}</b>. Faltam <b>${sd}</b> para o prazo.`);
    }
    alert=`<div class="alert" style="background:${hexA(col,.09)};border-color:${hexA(col,.32)}">
      <div class="ai" style="background:${hexA(col,.14)}"><svg viewBox="0 0 24 24" style="stroke:${col}">${ic}</svg></div>
      <div class="t" style="color:${col}">${titulo}</div>
      ${msg?`<div class="msg">${msg}</div>`:'<div style="flex:1"></div>'}
      ${P.mostrarData&&temData?`<div class="kv"><small>Previsão original até ${esc(et.nome)}</small><b>${fmt(P.previsao)}</b></div>`:''}
      ${P.mostrarStatus?`<div class="kv"><small>Status atual</small><b style="color:${stColor(et.status)}">${esc(et.status)} (${clamp(et.pct)}%)</b></div>`:''}
    </div>`;
  }

  const ok='<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>';
  const clock='<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
  const mel=D.melhorias.filter(m=>m.texto).map(m=>`<li><i class="bul"></i><span>${rich(m.texto)}</span></li>`).join('');
  const grp=D.proximas.filter(g=>g.titulo||g.itens).map(g=>`<div class="grp"><b>${esc(g.titulo)}</b><ul>${String(g.itens||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`).join('');
  const qd=D.quadro.filter(q=>q.entrega).map(q=>`<tr><td>${esc(q.entrega)}</td><td class="p">${esc(q.previsao)}</td><td>${chip(q.status)}</td></tr>`).join('');

  return `<div class="board">
    <div class="bgimg" style="background-image:url(${BG})"></div><div class="shade"></div><div class="glow"></div><div class="glow2"></div>
    <div class="inner">
      <div class="b-head">
        <img class="logo" src="${LOGO}" alt="">
        <div class="vr"></div>
        <div><div class="eyebrow">${esc(D.eyebrow)}</div><h1>${esc(D.titulo)}</h1><div class="sub">${esc(D.subtitulo)}</div></div>
        <div class="ref glass"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
          <div><small>Data de referência</small><b>${fmt(D.dataRef)}</b></div></div>
      </div>
      <div class="stages" style="grid-template-columns:repeat(${Math.max(n,1)},1fr)">${stages}</div>
      <div class="row2">${overall}${evo}</div>
      ${alert}
      <div class="row4">
        <div class="panel glass"><h3><svg viewBox="0 0 24 24" style="stroke:#34C15C"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>${esc(D.titulos.quadro1)}</h3><ul class="mlist">${mel}</ul></div>
        <div class="panel glass"><h3><svg viewBox="0 0 24 24" style="stroke:#8FB0FF"><path d="M5 12h14M13 6l6 6-6 6"/></svg>${esc(D.titulos.quadro2)}</h3><div class="groups">${grp}</div></div>
        <div class="panel glass"><h3><svg viewBox="0 0 24 24" style="stroke:#FF5A77"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${esc(D.titulos.quadro3)}</h3>
          <table class="qtable"><thead><tr><th>Entrega</th><th style="padding-left:12px">Previsão</th><th>Status</th></tr></thead><tbody>${qd}</tbody></table></div>
      </div>
      <div class="b-foot"><span>${esc(D.obs)}</span><span class="who">${esc(D.responsavel)}</span><span class="sep"></span><img src="${DEEP}" alt="Deep"></div>
    </div></div>`;
}

function renderBoards(){
  const html=boardHTML();
  document.getElementById('boardEdit').innerHTML=html;
  document.getElementById('boardView').innerHTML=html;
  fit();
}
function fit(){
  ['frameEdit','frameView'].forEach(id=>{
    const f=document.getElementById(id); if(!f.offsetWidth) return;
    f.firstElementChild.style.transform=`scale(${f.offsetWidth/1920})`;
  });
}
window.addEventListener('resize',fit);

/* ---------- Formulário ---------- */
const X_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function opts(list,sel){return list.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('')}
function sec(n,title,hint,body,open){return `<details class="sec" ${open?'open':''} data-sec="${n}"><summary><span class="n">${n}</span>${title}<span class="hint">${hint||''}</span>${CHEV}</summary><div class="body">${body}</div></details>`}

function renderForm(){
  const openSecs=[...document.querySelectorAll('.sec[open]')].map(s=>s.dataset.sec);
  const isOpen=n=>openSecs.length?openSecs.includes(String(n)):(n===1||n===2);
  const c=calc();
  const stageEd=D.etapas.map((e,i)=>`<div class="stage-edit">
      <div class="top"><span class="idx">${String(i+1).padStart(2,'0')}</span><input class="inp" data-k="etapas.${i}.nome" value="${esc(e.nome)}" placeholder="Nome da etapa"><button class="x" data-del="etapas.${i}" title="Remover etapa">${X_SVG}</button></div>
      <div class="pct-wrap"><input type="range" min="0" max="100" data-k="etapas.${i}.pct" data-num value="${clamp(e.pct)}"><input class="inp" type="number" min="0" max="100" data-k="etapas.${i}.pct" data-num value="${clamp(e.pct)}"><span class="help">%</span></div>
      <div class="g3">
        <label class="f">Status<select class="inp" data-k="etapas.${i}.status">${opts(Object.keys(STATUS),e.status)}</select></label>
        <label class="f">Peso (%)<input class="inp" type="number" min="0" max="100" data-k="etapas.${i}.peso" data-num value="${Number(e.peso)||0}"></label>
        <label class="f">Ícone<select class="inp" data-k="etapas.${i}.icone">${Object.keys(ICONS).map(k=>`<option value="${k}" ${k===e.icone?'selected':''}>${ICON_LABEL[k]}</option>`).join('')}</select></label>
      </div></div>`).join('');
  const pesoMsg=c.somaPeso===100?`<div class="okmsg">Soma dos pesos: 100%</div>`:`<div class="warn">A soma dos pesos está em ${c.somaPeso}%. O ideal é fechar em 100%.</div>`;

  const hist=(D.historico||[]).map((h,i)=>`<div class="hist-row"><input class="inp" type="date" data-k="historico.${i}.data" value="${esc(h.data)}"><input class="inp" type="number" min="0" max="100" data-k="historico.${i}.pct" data-num value="${clamp(h.pct)}"><button class="x" data-del="historico.${i}">${X_SVG}</button></div>`).join('');

  const mel=D.melhorias.map((m,i)=>`<div class="list-row"><input class="inp" data-k="melhorias.${i}.texto" value="${esc(m.texto)}" placeholder="Tópico"><button class="x" data-del="melhorias.${i}">${X_SVG}</button></div>`).join('');
  const tIn=(k,lbl)=>`<label class="f">${lbl||'Título do quadro'}<input class="inp" data-k="titulos.${k}" value="${esc(D.titulos[k])}" placeholder="${esc(TITULOS_PADRAO[k])}"></label>`;
  const chk=(k,lbl)=>`<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-k="prazo.${k}" data-bool ${D.prazo[k]?'checked':''}> ${lbl}</label>`;
  const prox=D.proximas.map((g,i)=>`<div class="group-edit"><div class="list-row"><input class="inp" data-k="proximas.${i}.titulo" value="${esc(g.titulo)}" placeholder="Etapa (ex.: Busca DOC)"><button class="x" data-del="proximas.${i}">${X_SVG}</button></div><textarea class="inp" data-k="proximas.${i}.itens" placeholder="Um item por linha">${esc(g.itens)}</textarea></div>`).join('');
  const qd=D.quadro.map((q,i)=>`<div class="q-row"><input class="inp" data-k="quadro.${i}.entrega" value="${esc(q.entrega)}" placeholder="Entrega"><input class="inp" data-k="quadro.${i}.previsao" value="${esc(q.previsao)}" placeholder="dd/mm/aaaa"><select class="inp" data-k="quadro.${i}.status">${opts(Q_STATUS,q.status)}</select><button class="x" data-del="quadro.${i}">${X_SVG}</button></div>`).join('');

  const f=document.getElementById('form');
  f.innerHTML=
  sec(1,'Cabeçalho e data','Data: '+fmt(D.dataRef),`
    <div class="row c2"><label class="f">Data de referência<input class="inp" type="date" data-k="dataRef" value="${esc(D.dataRef)}"></label>
    <label class="f">Título<input class="inp" data-k="titulo" value="${esc(D.titulo)}"></label></div>
    <label class="f">Linha superior<input class="inp" data-k="eyebrow" value="${esc(D.eyebrow)}"></label>
    <label class="f">Subtítulo<input class="inp" data-k="subtitulo" value="${esc(D.subtitulo)}"></label>
    <div class="help">Para começar a atualização de uma nova semana, use <b>Nova atualização</b>: o progresso atual vira um ponto no histórico e a data passa para hoje.</div>
    <div><button class="btn sm" id="btnNew">Nova atualização</button></div>`,isOpen(1))+
  sec(2,'Etapas do roadmap',D.etapas.length+' etapas',`
    <div class="help">Arraste a barra ou digite o percentual realizado. O peso é quanto a etapa representa no roadmap.</div>
    ${stageEd}${pesoMsg}
    <div><button class="btn sm" data-add="etapas">+ Adicionar etapa</button></div>`,isOpen(2))+
  sec(3,'Progresso geral e evolução',geral()+'%',`
    <div class="row c2">${tIn('progresso','Título do quadro de progresso')}${tIn('evolucao','Título do gráfico')}</div>
    <div class="help">Escolha como o progresso geral é calculado. O valor é atualizado sozinho.</div>
    <div class="calc">
      <label class="box ${D.criterio!=='ponderado'?'on':''}"><input type="radio" name="crit" value="simples" ${D.criterio!=='ponderado'?'checked':''}><b>${c.simples}%</b><span>Média simples (modelo anterior)</span></label>
      <label class="box ${D.criterio==='ponderado'?'on':''}"><input type="radio" name="crit" value="ponderado" ${D.criterio==='ponderado'?'checked':''}><b>${c.ponderado}%</b><span>Média ponderada pelos pesos</span></label>
    </div>
    <div class="help">Histórico de pontos anteriores (a data de referência atual entra sozinha no gráfico). O painel mostra os 6 últimos.</div>
    ${hist}
    <div><button class="btn sm" data-add="historico">+ Adicionar ponto</button></div>`,isOpen(3))+
  sec(4,'Alerta de prazo',D.prazo.mostrar?'Ativo':'Oculto',`
    ${chk('mostrar','Mostrar a faixa de alerta no painel')}
    <div class="row c2"><label class="f">Marco acompanhado<select class="inp" data-k="prazo.marco">${opts(D.etapas.map(e=>e.nome),D.prazo.marco)}</select></label>
    <label class="f">Previsão original<input class="inp" type="date" data-k="prazo.previsao" value="${esc(D.prazo.previsao)}"></label></div>
    <div class="row c2">${chk('mostrarData','Mostrar a data da previsão original')}${chk('mostrarStatus','Mostrar o status atual do marco')}</div>
    <div class="row c2"><label class="f">Título do alerta<input class="inp" data-k="prazo.titulo" value="${esc(D.prazo.titulo)}" placeholder="Automático (ex.: Atenção: atraso no roadmap)"></label>
    <label class="f">Cor da faixa<select class="inp" data-k="prazo.cor">${[['auto','Automática'],['vermelho','Vermelha (atenção)'],['amarelo','Amarela (ponto de atenção)'],['verde','Verde (no prazo)'],['azul','Azul (informativo)']].map(([v,l])=>`<option value="${v}" ${D.prazo.cor===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <label class="f">Mensagem<textarea class="inp" data-k="prazo.mensagem" placeholder="Deixe em branco para usar o texto automático com os dias de atraso">${esc(D.prazo.mensagem)}</textarea></label>
    <div class="help">Na mensagem você pode usar <b>{dias}</b>, <b>{marco}</b> e <b>{previsao}</b>, que são preenchidos sozinhos, e <b>**texto**</b> para negrito. Os dias de atraso contam da previsão original até a data de referência.</div>`,isOpen(4))+
  sec(5,esc(D.titulos.quadro1||'Quadro 1'),D.melhorias.length+' tópicos',`${tIn('quadro1')}<div class="help">Um tópico por linha. Use **texto** para negrito.</div>${mel}<div><button class="btn sm" data-add="melhorias">+ Adicionar tópico</button></div>`,isOpen(5))+
  sec(6,esc(D.titulos.quadro2||'Quadro 2'),D.proximas.length+' grupos',`${tIn('quadro2')}<div class="help">Um grupo por etapa. Escreva um item por linha.</div>${prox}<div><button class="btn sm" data-add="proximas">+ Adicionar grupo</button></div>`,isOpen(6))+
  sec(7,esc(D.titulos.quadro3||'Quadro 3'),D.quadro.length+' linhas',`${tIn('quadro3')}${qd}<div><button class="btn sm" data-add="quadro">+ Adicionar entrega</button></div>`,isOpen(7))+
  sec(8,'Rodapé','',`<label class="f">Observação<input class="inp" data-k="obs" value="${esc(D.obs)}"></label><label class="f">Responsável<input class="inp" data-k="responsavel" value="${esc(D.responsavel)}"></label>`,isOpen(8));
}

function setPath(path,val){const p=path.split('.');let o=D;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function getArr(path){return path.split('.').reduce((o,k)=>o[k],D)}
const BLANK={etapas:()=>({nome:'Nova etapa',pct:0,status:'Não iniciado',peso:0,icone:'entrega'}),historico:()=>({data:'',pct:0}),melhorias:()=>({texto:''}),proximas:()=>({titulo:'',itens:''}),quadro:()=>({entrega:'',previsao:'',status:'Não iniciado'})};

let rt;
function changed(rebuildForm){persist();clearTimeout(rt);rt=setTimeout(()=>{renderBoards();if(rebuildForm)renderForm();else refreshHints()},60)}
function refreshHints(){
  const c=calc();
  document.querySelectorAll('.calc .box b')[0]&&(document.querySelectorAll('.calc .box b')[0].textContent=c.simples+'%');
  document.querySelectorAll('.calc .box b')[1]&&(document.querySelectorAll('.calc .box b')[1].textContent=c.ponderado+'%');
  const h=document.querySelector('[data-sec="3"] .hint'); if(h)h.textContent=geral()+'%';
  const h1=document.querySelector('[data-sec="1"] .hint'); if(h1)h1.textContent='Data: '+fmt(D.dataRef);
}

const form=document.getElementById('form');
form.addEventListener('input',e=>{
  const el=e.target;
  if(el.name==='crit'){D.criterio=el.value;document.querySelectorAll('.calc .box').forEach(b=>b.classList.toggle('on',b.querySelector('input').checked));return changed(false)}
  const k=el.dataset.k; if(!k) return;
  let v=el.dataset.bool!==undefined?el.checked:el.value;
  if(el.dataset.num!==undefined) v=clamp(v);
  setPath(k,v);
  if(k.endsWith('.pct')&&k.startsWith('etapas')) form.querySelectorAll(`[data-k="${k}"]`).forEach(x=>{if(x!==el)x.value=v});
  const structural=/\.nome$|\.peso$/.test(k)&&k.startsWith('etapas');
  changed(false);
  if(structural){clearTimeout(form._st);form._st=setTimeout(()=>{if(!form.contains(document.activeElement)||document.activeElement.tagName!=='INPUT')renderForm()},900)}
});
form.addEventListener('change',e=>{const k=e.target.dataset.k||'';if(/etapas\.\d+\.(nome|peso)|prazo\.mostrar$|titulos\./.test(k))renderForm()});
form.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]'), del=e.target.closest('[data-del]');
  if(add){e.preventDefault();getArr(add.dataset.add).push(BLANK[add.dataset.add]());changed(true)}
  if(del){e.preventDefault();const p=del.dataset.del.split('.');const idx=+p.pop();getArr(p.join('.')).splice(idx,1);changed(true)}
  if(e.target.id==='btnNew'){
    e.preventDefault();
    const hoje=new Date(); const iso=new Date(hoje.getTime()-hoje.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    D.historico=(D.historico||[]).filter(h=>h.data!==D.dataRef); D.historico.push({data:D.dataRef,pct:geral()});
    D.dataRef=iso; changed(true); toast('Ponto de '+fmt(D.historico[D.historico.length-1].data)+' guardado no histórico. Atualize os percentuais.');
  }
});

/* ---------- Abas, arquivos, exportação ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.tab));
  fit();
});
function stamp(){return fmt(D.dataRef).replace(/\//g,'-')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.getElementById('btnSave').onclick=()=>{download(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),`Roadmap_Operacao_Integrada_dados_${stamp()}.json`);toast('Arquivo de dados salvo')};
document.getElementById('btnOpen').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.etapas)throw 0;D=normalize(Object.assign(clone(SAMPLE),o));changed(true);toast('Dados carregados: '+fmt(D.dataRef))}catch(err){toast('Arquivo inválido. Use um arquivo salvo por este painel.')}};
  r.readAsText(f); e.target.value='';
};
document.getElementById('btnReset').onclick=()=>{if(confirm('Substituir os dados atuais pelo exemplo de 25/06/2026?')){D=normalize(clone(SAMPLE));changed(true);toast('Exemplo restaurado')}};
document.getElementById('btnPng').onclick=exportPNG;

async function exportPNG(){
  const scale=+document.getElementById('res').value;
  const ov=document.getElementById('overlay'); ov.classList.add('on');
  const host=document.createElement('div'); host.id='exportHost'; host.innerHTML=boardHTML(); document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const canvas=await html2canvas(host.firstElementChild,{scale,backgroundColor:'#070B14',useCORS:true,logging:false,width:1920,height:1080,windowWidth:1920,windowHeight:1080,scrollX:0,scrollY:0});
    await new Promise(res=>canvas.toBlob(b=>{download(b,`Roadmap_Operacao_Integrada_${stamp()}.png`);res()},'image/png'));
    toast(`PNG exportado (${1920*scale} × ${1080*scale})`);
  }catch(err){console.error(err);toast('Não foi possível gerar o PNG neste navegador.')}
  finally{host.remove();ov.classList.remove('on')}
}
window.exportPNG=exportPNG;

renderForm(); renderBoards(); requestAnimationFrame(fit);
</script>
</body>
</html>
